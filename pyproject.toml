[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habmab"
version = "0.1.0"
description = "Harmful Algal Bloom Multi-Armed Bandit: adaptive HAB monitoring with contextual bandits and sparse convex reconstruction."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
habmab = "habmab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["habmab*"]
